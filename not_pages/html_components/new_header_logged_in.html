<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

     <script src="../script.js" defer></script> 
     <script src="../login/logout.js" defer></script> 

</head>
<body>


        <header class="topbar">
            <div class="topbar_left">
                <div class="tooltip_container">
                    <a href="../semester_overview_homepage/semester_overview.html" aria-label="Go to homepage" class="brand">
                        <img src="../imgs/Logo_header.svg" alt="Exam Ease logo">
                        <span class="brand_name">Exam Ease</span>
                        </a>
                    <div class="tooltip_box header_left">
                        Navigate to Homepage
                    </div>
                </div>
                <!-- Normal nav (desktop) -->
                <nav class="nav_links">
                    <a href="../my_submission/my_submission.html" class="btn" id="submissionsLink">My Submissions</a>
                    <a href="../submission_forms/student_submission.html" class="btn">Submission Form</a>
                    <a href="../submission_info/submission_info.html" class="btn">Submission Information</a>
                </nav>
                <!-- Dropdown (mobile) -->
                <nav class="dropdown">
                    <button class="btn nav_dropdown dropdownButton">Menu</button>
                    <div class="dropdown_content nav_links">
                        <a href="../my_submission/my_submission.html" class="btn" id="submissionsLink">My Submissions</a>
                        <a href="../submission_forms/student_submission.html" class="btn">Submission Form</a>
                        <a href="../submission_info/submission_info.html" class="btn">Submission Information</a>
                    </div>
                </nav>
            </div>
            <div class="topbar_right">
                <button class="btn btn_search">
                    <img src="../imgs/search-icon.webp" alt="Search icon">
                </button>
                <input class="search_bar" type="text" placeholder="Search"/>
                <div class="dropdown">
                    <div class="tooltip_container">
                        <button class="btn btn_profile dropdownButton" aria-label="Show profile">
                            <img src="../imgs/profile_icon.svg" alt="Profile icon">
                            </button>
                        <div class="tooltip_box header_rigth">
                            Show Profile
                        </div>
                        </div>
                    <aside class="popup profile_dropdown dropdown_content">
                        <p id= "profile_username"></p>
                        <hr/>
                        <h4><a href="../my_submission/my_submission.html">My submissions</a></h4>
                        <hr/>
                        <h4 id="profile_role"></h4>
                        <p id="profile_email"></p>
                        <p id="profile_university"></p>
                        <p id="profile_fieldofstudy"></p>
                        <p id="profile_semester"></p>
                        
                        <div class="buttons">
                            <button class="small_btn btn_logout" id="logoutBtn">Log out</button>
                            <button class="small_btn btn_delete" onclick="on('deleteOverlay')">Delete profile</button>
                        </div>
                    </aside>
                </div>
            </div>
        </header>

        
    </div>

<!-- FULL SCREEN OVERLAYS -->
	<!-- Profile Has Been Successfully Deleted -->
	<div class="overlay" id="deleteOverlay">
		<div class="inside_overlay delete_profile">
		<h1>Your profile has been successfully deleted!</h1>
		<a href="../index.html" class="md_btn close" onclick="off('deleteOverlay')">Close</a>
		</div>
	</div>
    <script>
   const user = JSON.parse(localStorage.getItem('user'));
   if (user) {
       document.getElementById('profile_username').textContent = user.username;
       document.getElementById('profile_email').textContent = user.email;
       document.getElementById('profile_university').textContent = user.university;
       document.getElementById('profile_semester').textContent = user.semester + '. Semester';
       document.getElementById('profile_fieldofstudy').textContent = user.fieldofstudy;
       document.getElementById('profile_role').textContent = 'Profile (' + user.role + ')';
   }
</script>

</body>
</html>
