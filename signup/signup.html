<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8"/><!-- --Sets character encoding to UTF-8. Allows special characters (like æ, ø, å, emojis, etc.) to display correctly.-->
	<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
	<link rel="icon" type="image/svg+xml" href="../imgs/Logo_website_tab.svg"/><!-- --Picture on the web tab-->
	<link rel="stylesheet" href="../style.css"/><!-- --Linking this file to the CSS file-->
	<script src="../script.js" defer></script><!-- --Linking this file to the corresponding JS file. !!This changes for each html page, it should be the name of the js file in the same folder. -->
	<script src="../signup/signup.js" defer></script> 
	<title>Exam Ease - Sign up</title>
	
</head>
<body>
	<div class="container">
		<header class="topbar logged_out">
			<div class="topbar_left">
				<div class="tooltip_container">
					<a href="../index.html" class="brand" aria-label="Go to frontpage">
						<img src="../imgs/Logo_header.svg" alt="Exam Ease logo">
						<span class="brand_name">Exam Ease</span>
					</a>
					<div class="tooltip_box header_left">
						Navigate to Frontpage
					</div>
				</div>
				<nav class="nav_links">
					<a href="../submission_forms/student_submission.html" class="btn">Submission Form</a>
					<a href="../submission_info/submission_info.html" class="btn">Submission Information</a>
				</nav>
				<nav class="dropdown">
					<button class="btn nav_dropdown dropdownButton">Menu</button>
					<div class="dropdown_content nav_links">
						<a href="../submission_forms/student_submission.html" class="btn">Submission Form</a>
						<a href="../submission_info/submission_info.html" class="btn">Submission Information</a>
					</div>
				</nav>
			</div>
			<div class="topbar_right">
				<button class="btn btn_search">
					<img src="../imgs/search-icon.webp" alt="Search icon">
				</button>
				<input class="search_bar" type="text" placeholder="Search"/>
				<a href="../login/login.html" class="btn btn_ghost_login">Log in</a>
				<a href="../signup/signup.html" class="btn btn_signup">Sign up</a>
			</div>
		</header>
		<main class="main">
			<div class="signup_container">
				<h1>Sign up</h1>
				<div class="signup_grid">
					<div class="signup_item">
						<label for="name">First- and last name</label>
						<input class="name" type="text" placeholder="E.g. Sara Hansen"/>
					</div>
					<div class="signup_item">
						<label>I am a...</label>
						<div class="signup_role">
							<label class="role_option" for="student">
								<input type="checkbox" class="checkbox" id="Check1" value="Value1" onclick="chooseOne(this.id)"/>
								<p>Student</p>
							</label>
							<label class="role_option" for="professor">
								<input type="checkbox" class="checkbox" id="Check2" value="Value1" onclick="chooseOne(this.id)"/>
								<p>Professor</p>
							</label>
						</div>
					</div>
					<div class="signup-row-two">
						<div class="signup_item">
							<label for="university">University</label>
							<div class="dropdown">
								<select name="university" id="university">
									<option value="" disabled selected>Select a university</option>
									<option value="Aalborg university CPH">Aalborg University (CPH)</option>
								</select>
							</div>
						</div>
						<div class="signup_item">
							<label for="field" >Field of study</label>
							<div class="dropdown">
								<select name="field" id="field">
									<option value="" disabled selected>Select a field of study</option>
									<option value="Software">Software, Bachelor</option>
									<option value="Cybersecurity">Cybersecurity, Bachlor</option>
									<option value="Biology">Biology, Bachelor</option>
									<option value="Psychology">Psychology, Bachelor</option>
									<option value="History">History, Bachelor</option>
									<option value="Biotechnology">Biotechnology, Bachelor</option>
								</select>
							</div>
						</div>
						<div class="signup_item semester">
							<label for="semester">Semester</label>
							<div class="dropdown">
								<select name="semester" id="semester">
									<option value="" disabled selected>Select a semester</option>
									<option value="1">1. Semester</option>
									<option value="2">2. Semester</option>
									<option value="3">3. Semester</option>
									<option value="4">4. Semester</option>
									<option value="5">5. Semester</option>
									<option value="6">6. Semester</option>
								</select>
							</div>
						</div>
					</div>
					<div class="signup_item emails">
						<label for="email">E-mail</label>
						<input type="email" class="email" placeholder="E.g. Sara.hansen@student.aau.dk"/>
					</div>
					<div class="signup-row-four">
						<div class="signup_item">
							<label for="username">Username</label>
							<input type="text" id="username" placeholder="E.g. Sara123!"/>
						</div>
						<div class="signup_item">
							<label for="password">Password</label>
							<input type="password" id="password" placeholder="E.g. Exam!ease1234"/>
						</div>
					</div>
				</div>
				<button class="signup-btn" id= "signupBtn" >Sign up</button>
			</div>
		</main>
		<footer class="footer">
			<div class="footer_column footer_column_left">
				<h4>Submissions</h4> <!-- --?-- "Submissions" instead of "Submit Your Input" or something else? -->
				<ul>
					<li><a href="../submission_info/submission_info.html">Submission Information</a></li>
					<li><a href="../submission_forms/student_submission.html">Submission Form</a></li>
				</ul>
			</div>
			<div class="footer_column footer_column_right visible_link">
				<h4>IT Support</h4>
				<p><a href="#">Tel: +45 00 00 00 00</a></p>
				<p><a href="#">E-mail: itservice@support.dk</a></p>
			</div>
		</footer>
	</div>
</body>
</html>
