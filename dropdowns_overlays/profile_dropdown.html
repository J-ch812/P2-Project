<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" /> <!-- --Sets character encoding to UTF-8. Allows special characters (like æ, ø, å, emojis, etc.) to display correctly.-->
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link rel="icon" type="image/svg+xml" href="../imgs/Logo.svg" /> <!-- --Picture on the web tab-->
	<link rel="stylesheet" href="../style.css" /> <!-- --Linking this file to the CSS file-->
<script src="../script.js" defer></script> <!-- --Linking this file to the corresponding JS file. !!This changes for each html page, it should be the name of the js file in the same folder. -->
	<title>Profile dropdown</title>
</head>
<body>
	<div class="container">
                <div class="dropdown">
                    <button class="btn btn_profile dropdownButton">
                        <img src="../imgs/profile_icon.svg" alt="Profile icon"/>
                    </button>
                    <aside class="popup profile_dropdown dropdown_content">
                        <p>Sara123!</p>
                        <hr/>
                        <h4><a href="../my_submission/my_submission.html">My submissions</a></h4>
                        <hr/>
                        <h4>Profile (Student)</h4>
                        <p>Sara Hansen</p>
                        <p>Sara.hansen@student.aau.dk</p>
                        <p>Aalborg University Copenhagen</p>
                        <p>1. Semester</p>
                        <p>Software, Bachelor</p>
                        <div class="buttons">
                            <button class="small_btn btn_logout"><a href="../index.html">Logout</a></button>
                            <button class="small_btn btn_delete" onclick="on('deleteOverlay')">Delete profile</button>
                        </div>
                    </aside>
                </div>
	</div>





		
<!-- FULL SCREEN OVERLAYS -->
	<!-- Profile Has Been Successfully Deleted -->
	<div class="overlay" id="deleteOverlay">
		<div class="inside_overlay delete_profile">
		<h1>Your profile has been successfully deleted!</h1>
		<a href="../index.html" class="md_btn close" onclick="off('deleteOverlay')">Close</a>
		</div>
	</div>
</body>
</html>
