<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- <link href='https://fonts.googleapis.com/css?family=Inria Sans' rel='stylesheet'> -->  <!-- imports the Inria Sans font, other wise its just serif-->
  <link rel="icon" type="image/svg+xml" href="imgs/Logo.svg"/>
  <link rel="stylesheet" href="style.css"/>
  <script src="script.js" defer></script>
  <title>Exam Ease</title>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="topbar__logo">
        <img src="imgs/Logo.svg" alt="Exam Ease logo" class="svg" />
      </div>

      <div class="topbar__actions">
        <input class="search-input" type="text" placeholder="Search" />
        <button class="btn btn--ghost">Log in</button>
        <button class="btn btn--primary">Sign up</button>
      </div>
    </header>

    <main class="hero">
      <h1>Exam Ease</h1>
      <p>
        Study smarter, stress less.
        <br>
        Helping students navigate their courses and curriculum.
      </p>

      <section class="course-grid">
        <button class="course-card">Software - AAU, Bachelor</button>
        <button class="course-card">Cybersecurity - AAU, Bachelor</button>
        <button class="course-card">Biology - AAU, Bachelor</button>
        <button class="course-card">Psychology - AAU, Bachelor</button>
        <button class="course-card">History - AAU, Bachelor</button>
        <button class="course-card">Biotechnology - AAU, Bachelor</button>
      </section>
    </main>

    <footer class="footer">
      <div class="footer__column">
        <h2>Submit your input</h2>
        <ul>
          <li>Submission info</li>
          <li>Students – submission form</li>
          <li>Professors – submission form</li>
        </ul>
      </div>

      <div class="footer__column">
        <h2>IT support</h2>
        <p>Tel: +45 00 00 00 00</p>
        <p>E-mail: itservice@support.dk</p>
      </div>
    </footer>
  </div>
</body>
